name: Build Tobz Android APK

on:
  push:
    branches: [main]
    paths:
      - "native-app/**"
      - ".github/workflows/build-native-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        run: gradle -p native-app :app:assembleDebug

      - name: Publish latest APK download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p release
          cp native-app/app/build/outputs/apk/debug/app-debug.apk release/tobz-shisanyama.apk
          TAG="native-build-${RUN_NUMBER}"
          gh release create "$TAG" release/tobz-shisanyama.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tobz Shisanyama Android build ${RUN_NUMBER}" \
            --notes "Automatically built Android APK from commit ${GITHUB_SHA}." \
