<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171714">
  <meta name="robots" content="noindex">
  <title>You're Offline | Tobz Shisanyama</title>
  <style>
    :root{color-scheme:dark;--bg:#171714;--panel:#22221e;--cream:#f5f2eb;--muted:#aaa79e;--orange:#e97832}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;padding:28px 22px;background:radial-gradient(ellipse at 50% 35%,#343027 0%,var(--bg) 65%);color:var(--cream);font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center}
    main{width:min(100%,430px);text-align:center}
    .brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:68px;font-size:15px;font-weight:800;letter-spacing:2px}
    .brand-mark{display:grid;place-items:center;width:36px;height:36px;background:var(--orange);color:#171714;font-size:23px;font-weight:900}
    .icon-wrap{width:142px;height:142px;margin:0 auto 34px;border:1px solid #51483b;border-radius:50%;display:grid;place-items:center;background:#25231e;box-shadow:0 0 0 12px #ffffff06}
    .icon-wrap svg{width:72px;height:72px;stroke:var(--orange);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .eyebrow{color:var(--orange);font-size:11px;font-weight:800;letter-spacing:3px;margin:0 0 14px}
    h1{font-size:clamp(38px,10vw,54px);line-height:.98;letter-spacing:-2px;margin:0 0 18px}
    p.copy{color:var(--muted);font-size:15px;line-height:1.7;margin:0 auto;max-width:330px}
    .status{display:inline-flex;align-items:center;gap:9px;margin:30px 0 26px;padding:10px 14px;border:1px solid #51483b;border-radius:30px;color:#ddd7ca;font-size:12px}
    .dot{width:8px;height:8px;border-radius:50%;background:#e97832;box-shadow:0 0 0 4px #e9783222}
    button{display:block;width:100%;border:0;border-radius:3px;padding:16px 20px;background:var(--orange);color:#171714;font-weight:900;letter-spacing:1px;font-size:12px;cursor:pointer}
    button:active{transform:scale(.985)}
    .hint{font-size:11px;color:#817e75;margin:18px 0 0}
    .footer{margin-top:70px;color:#77746c;font-size:10px;letter-spacing:1.5px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark">T</span><span>TOBZ SHISANYAMA</span></div>
    <div class="icon-wrap" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <path d="M8 23a36 36 0 0 1 43-5M13 34a25 25 0 0 1 26-5M20 45a13 13 0 0 1 10-4"/>
        <path d="M7 7l50 50"/>
        <circle cx="32" cy="53" r="2" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <p class="eyebrow">CONNECTION LOST</p>
    <h1>YOU'RE<br>OFFLINE.</h1>
    <p class="copy">Looks like the internet has stepped away from the fire. Check your connection and we'll get you back to the good stuff.</p>
    <div class="status"><span class="dot"></span><span id="status-text">No internet connection</span></div>
    <button type="button" id="retry">TRY AGAIN</button>
    <p class="hint">Your Tobz app is saved on this device.</p>
    <div class="footer">GOOD FOOD. GOOD FIRE. GOOD TIMES.</div>
  </main>
  <script>
    const statusText = document.getElementById("status-text");
    const retry = document.getElementById("retry");
    function updateStatus() {
      const online = navigator.onLine;
      statusText.textContent = online ? "Connection detected — refreshing…" : "No internet connection";
      if (online) setTimeout(() => location.reload(), 500);
    }
    retry.addEventListener("click", () => {
      statusText.textContent = "Checking connection…";
      if (navigator.onLine) location.reload();
      else statusText.textContent = "Still offline. Please check your connection.";
    });
    window.addEventListener("online", updateStatus);
    window.addEventListener("offline", updateStatus);
  </script>
</body>
</html>
